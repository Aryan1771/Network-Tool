services:
  - type: web
    name: network-tool
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: network-tool-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        value: analyst
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: FLASK_DEBUG
        value: "false"
